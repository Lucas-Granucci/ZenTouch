<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ZenTouch — from hand motion to kiosk action</title>
  <desc id="description">Camera input flows through hand tracking and smoothing, the intent engine, feedback and selection, and finally a kiosk action. Live UI target geometry also feeds the intent engine. All processing runs on the device.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#9594A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7761C5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g font-family="Noto Sans, Arial, sans-serif">
    <text x="64" y="110" font-size="21" font-weight="700" letter-spacing="3" fill="#7761C5">ZENTOUCH</text>
    <text x="64" y="181" font-size="49" font-weight="700" letter-spacing="-1.3" fill="#242331">From hand motion to kiosk action</text>

    <!-- Five main stages, read from left to right. -->
    <g fill="#F8F8FB" stroke="#E6E5EC" stroke-width="2">
      <rect x="64" y="308" width="256" height="245" rx="22"/>
      <rect x="368" y="308" width="256" height="245" rx="22"/>
      <rect x="976" y="308" width="256" height="245" rx="22"/>
      <rect x="1280" y="308" width="256" height="245" rx="22"/>
    </g>
    <rect x="672" y="308" width="256" height="245" rx="22" fill="#F1EDFF" stroke="#AA97E1" stroke-width="2"/>

    <g fill="none" stroke="#9594A4" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 330 430 H 356"/>
      <path d="M 634 430 H 660"/>
      <path d="M 938 430 H 964"/>
      <path d="M 1242 430 H 1268"/>
    </g>

    <!-- Small icons keep the stages recognizable at slide scale. -->
    <g fill="none" stroke="#7761C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="168" y="351" width="48" height="32" rx="7"/>
      <circle cx="192" cy="367" r="8"/>
      <path d="M 181 351 L 185 344 H 199 L 203 351"/>
      <path d="M 470 372 C 480 345, 484 388, 493 365 S 508 355, 521 359"/>
      <path d="M 470 386 H 521" stroke="#C6BDD9" stroke-width="2"/>
      <path d="M 776 354 H 810 M 776 367 H 823 M 776 380 H 796" stroke-width="6"/>
      <rect x="1083" y="346" width="42" height="42" rx="12" fill="#EEE9FC" stroke="none"/>
      <circle cx="1104" cy="367" r="26" stroke="#D6CBEE" stroke-width="2"/>
      <path d="M 1094 367 L 1101 374 L 1115 359"/>
      <rect x="1389" y="342" width="38" height="48" rx="6"/>
      <path d="M 1399 364 L 1406 371 L 1417 357 M 1403 383 H 1413"/>
    </g>

    <g text-anchor="middle" font-size="24" font-weight="700" fill="#242331">
      <text x="192" y="434">Camera input</text>
      <text x="496" y="434">Track &amp; smooth</text>
      <text x="800" y="434" fill="#55408F">Intent engine</text>
      <text x="1104" y="434">Feedback &amp; select</text>
      <text x="1408" y="434">Kiosk action</text>
    </g>
    <g text-anchor="middle" font-size="20" fill="#666476">
      <text x="192" y="477">One RGB webcam</text>
      <text x="192" y="507">Hand motion</text>
      <text x="496" y="477">Hand landmarks</text>
      <text x="496" y="507">Pointing + EKF</text>
      <text x="800" y="477">Score UI targets</text>
      <text x="800" y="507">Stabilize probabilities</text>
      <text x="1104" y="477">Soft-snap shadow</text>
      <text x="1104" y="507">Dwell or gesture</text>
      <text x="1408" y="477">Selection event</text>
      <text x="1408" y="507">Update the UI</text>
    </g>

    <!-- The DOM is a second input to intent inference. -->
    <path d="M 800 644 V 570" fill="none" stroke="#7761C5" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
    <rect x="653" y="653" width="294" height="88" rx="16" fill="#FFFFFF" stroke="#D6CBEE" stroke-width="2"/>
    <text x="800" y="689" text-anchor="middle" font-size="22" font-weight="600" fill="#55408F">Live UI targets</text>
    <text x="800" y="718" text-anchor="middle" font-size="19" fill="#666476">DOM geometry</text>

    <path d="M 64 798 H 1536" stroke="#E6E5EC" stroke-width="1.5"/>
    <text x="64" y="839" font-size="20" fill="#777485">One camera · No cursor · All processing on device</text>
  </g>
</svg>
