<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Kiosk — Customize</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #1c1a16;
    --muted: #6e6a60;
    --paper: #ffffff;
    --surface: #eef0ea;
    --line: #dfe2da;
    --counter: #14150f;
    --brand: #1f4d3a;
    --brand-tint: #e8f1ea;
    --interact: #b8481f;
    --disabled-bg: #e2e4dc;
    --disabled-fg: #59554e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--counter);
    font-family: 'Work Sans', system-ui, sans-serif;
    color: var(--ink); cursor: none;
    -webkit-user-select: none; user-select: none;
    display: flex; justify-content: center; padding: 30px 16px;
  }
  h1, h2, h3 { margin: 0; font-family: 'Fredoka', system-ui, sans-serif; }
  ::selection { background: var(--brand); color: #fff; }

  .device {
    width: 100%; max-width: 1180px; height: calc(100vh - 60px);
    background: var(--paper); border-radius: 12px;
    box-shadow: 0 34px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    overflow: hidden; display: flex; flex-direction: row;
  }
  @media (max-width: 1220px) {
    body { padding: 0; }
    .device { border-radius: 0; box-shadow: none; height: 100vh; }
  }
  @media (max-width: 720px) {
    .device { flex-direction: column; }
    .hero { flex: 0 0 auto !important; width: 100% !important; aspect-ratio: 16/9; }
  }
  .main-panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .device-scroll { flex: 1 1 auto; overflow-y: auto; }

  #tt-cursor {
    position: fixed; top: 0; left: 0; width: 58px; height: 58px;
    margin-left: -29px; margin-top: -29px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(60,56,52,0.48), rgba(60,56,52,0.13) 60%, transparent 78%);
    pointer-events: none; z-index: 9999;
    transition: width .18s ease, height .18s ease, background .18s ease, opacity .2s ease;
    will-change: transform;
  }
  #tt-cursor.tt-cursor-armed {
    width: 32px; height: 32px; margin-left: -16px; margin-top: -16px;
    background: radial-gradient(circle at 50% 50%, rgba(184,72,31,0.58), rgba(184,72,31,0.2) 60%, transparent 78%);
  }

  .hero { position: relative; flex: 0 0 40%; height: 100%; background: var(--surface); }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .back-btn { position: absolute; top: 16px; left: 16px; }

  .content-pad { padding: 20px 24px 24px; }

  .touch-target {
    position: relative;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 2px rgba(32,28,26,0.04), 0 10px 22px rgba(32,28,26,0.07);
    transform: translateY(0) scale(1);
    transition: transform .17s cubic-bezier(.2,.8,.3,1), box-shadow .17s ease, border-color .17s ease, background .17s ease;
    cursor: none; overflow: hidden;
  }
  .touch-target.tt-disabled { box-shadow: none; }
  .touch-target.armed {
    transform: translateY(-4px) scale(1.025);
    border-color: var(--interact);
    box-shadow: 0 16px 30px rgba(32,28,26,.22), 0 0 0 3px rgba(184,72,31,.4);
    z-index: 5;
  }
  .touch-target.armed::before {
    content: attr(data-armed-label); position: absolute; left: 14px; bottom: 12px;
    color: var(--interact); font: 700 11px/1 'Work Sans', sans-serif;
    letter-spacing: .04em; z-index: 2;
  }
  .touch-target::after {
    content: ''; position: absolute; left: 0; bottom: 0; height: 4px;
    width: calc(var(--tt-progress, 0) * 100%); background: var(--interact); z-index: 3;
  }
  .touch-target.tt-flash { animation: tt-flash .22s ease; }
  @keyframes tt-flash {
    0% { transform: translateY(-4px) scale(1.07); }
    100% { transform: translateY(-4px) scale(1.025); }
  }
  .touch-target.btn.armed::before { display: none; }

  .back-btn {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.94);
  }
  .back-btn svg path { transition: stroke .17s ease; }
  .back-btn.armed svg path { stroke: var(--interact); }

  .touch-target.selected { border-color: var(--brand); background: var(--brand-tint); }
  .touch-target.selected .name { display: flex; align-items: center; gap: 6px; }
  .touch-target.selected .check { width: 15px; height: 15px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .item-title { font-size: 21px; font-weight: 600; margin-bottom: 4px; }
  .item-price { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 6px; color: var(--muted); }
  .item-desc { font-size: 13.5px; color: var(--muted); margin-bottom: 20px; max-width: 52ch; line-height: 1.5; font-weight: 500; }

  h2.section-title {
    font-family: 'Work Sans', sans-serif;
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .req-tag {
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    background: var(--interact); color: #fff; padding: 3px 9px; border-radius: 999px;
  }

  .side-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 30px; }
  .side-option { padding: 24px 22px 40px; min-height: 92px; display: flex; flex-direction: column; justify-content: center; }
  .side-option .name { font-weight: 600; font-size: 17px; }
  .side-option .add { font-size: 13.5px; color: var(--muted); margin-top: 5px; font-weight: 500; }
  .touch-target.selected .add { color: #2f6b4e; }

  .qty-row { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
  .qty-btn {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
  }
  .qty-value { font-size: 18px; font-weight: 700; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-family: 'Fredoka', sans-serif; }

  .confirm-bar {
    flex: 0 0 auto;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .total { font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .total b { color: var(--ink); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; }
  .pill-btn {
    border-radius: 999px; padding: 15px 32px; font-size: 14px; font-weight: 700;
    font-family: 'Work Sans', sans-serif; color: #fff; border: none;
    background: var(--brand);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.13), 0 10px 20px rgba(32,28,26,.22);
  }
  .pill-btn.armed {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.1), 0 16px 28px rgba(32,28,26,.22), 0 0 0 3px rgba(184,72,31,.4);
  }
  .pill-btn.tt-disabled { background: var(--disabled-bg); color: var(--disabled-fg); box-shadow: none; }
</style>
</head>
<body>
  <div class="device">
    <div class="hero">
      <div class="touch-target btn back-btn" id="back-btn" data-armed-label="Back">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none"><path d="M15 5L8 12L15 19" stroke="#201c1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="main-panel">
      <div class="device-scroll">
        <div class="content-pad">
          <h1 class="item-title" id="item-name">Item</h1>
          <div class="item-price" id="item-base-price">$0.00</div>
          <p class="item-desc" id="item-desc"></p>

          <h2 class="section-title">Choose a side <span class="req-tag">Required</span></h2>
          <div class="side-grid" id="side-grid"></div>

          <h2 class="section-title">Quantity</h2>
          <div class="qty-row">
            <div class="touch-target btn qty-btn" data-qty="dec" data-hold-ms="500" data-armed-label="Hold −" id="qty-dec"></div>
            <div class="qty-value" id="qty-value">1</div>
            <div class="touch-target btn qty-btn" data-qty="inc" data-hold-ms="500" data-armed-label="Hold +" id="qty-inc"></div>
          </div>
        </div>
      </div>

      <div class="confirm-bar">
        <div class="total">Total <b id="total-price">$0.00</b></div>
        <div class="touch-target btn pill-btn tt-disabled" id="add-btn" data-armed-label="Hold to add">Add to cart</div>
      </div>
    </div>
  </div>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const rid = params.get('r') || 'underground';
  const itemId = params.get('item');
  const r = MENU_DATA[rid];
  const item = ttFindItem(rid, itemId) || r.items[0];

  const heroImg = new Image();
  heroImg.src = item.image;
  heroImg.alt = item.name;
  document.querySelector('.hero').prepend(heroImg);
  document.getElementById('back-btn').dataset.href = `menu.html?r=${rid}`;
  document.getElementById('item-name').textContent = item.name;
  document.getElementById('item-base-price').textContent = ttMoney(item.price);
  document.getElementById('item-desc').textContent = item.desc;

  const minusIcon = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 12h14" stroke="#201c1a" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const plusIcon = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 5v14M5 12h14" stroke="#201c1a" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const checkIcon = `<svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M5 12.5L9.5 17L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  document.getElementById('qty-dec').innerHTML = minusIcon;
  document.getElementById('qty-inc').innerHTML = plusIcon;

  let selectedSide = null;
  let qty = 1;

  const sideGrid = document.getElementById('side-grid');
  item.sides.forEach((side) => {
    const el = document.createElement('div');
    el.className = 'touch-target side-option';
    el.dataset.side = side.name;
    el.dataset.add = side.add;
    el.innerHTML = `
      <div class="name"><span class="check-slot"></span><span class="label">${side.name}</span></div>
      <div class="add">${side.add > 0 ? '+' + ttMoney(side.add) : 'no charge'}</div>
    `;
    sideGrid.appendChild(el);
  });

  function updateTotal() {
    const addOn = selectedSide ? parseFloat(selectedSide.dataset.add) : 0;
    const total = (item.price + addOn) * qty;
    document.getElementById('total-price').textContent = ttMoney(total);
    const addBtn = document.getElementById('add-btn');
    if (selectedSide) addBtn.classList.remove('tt-disabled');
    else addBtn.classList.add('tt-disabled');
  }
  updateTotal();

  document.addEventListener('tt-confirm', (e) => {
    const el = e.target;
    if (el.dataset.side) {
      sideGrid.querySelectorAll('.side-option').forEach((s) => {
        s.classList.remove('selected');
        const slot = s.querySelector('.check-slot');
        if (slot) slot.innerHTML = '';
      });
      el.classList.add('selected');
      el.querySelector('.check-slot').innerHTML = `<span class="check">${checkIcon}</span>`;
      selectedSide = el;
      updateTotal();
    }
    if (el.dataset.qty === 'inc') {
      qty += 1;
      document.getElementById('qty-value').textContent = qty;
      updateTotal();
    }
    if (el.dataset.qty === 'dec') {
      qty = Math.max(1, qty - 1);
      document.getElementById('qty-value').textContent = qty;
      updateTotal();
    }
    if (el.id === 'add-btn' && selectedSide) {
      const cart = JSON.parse(sessionStorage.getItem('zt-cart') || '[]');
      cart.push({
        rid,
        itemId: item.id,
        restaurant: r.name,
        name: item.name,
        side: selectedSide.dataset.side,
        qty,
        unitPrice: item.price + parseFloat(selectedSide.dataset.add),
      });
      sessionStorage.setItem('zt-cart', JSON.stringify(cart));
      setTimeout(() => { window.location.href = 'cart.html'; }, 160);
    }
  });
</script>
<script src="engine.js"></script>
</body>
</html>
