<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #1c1a16;
    --muted: #6e6a60;
    --paper: #ffffff;
    --counter: #14150f;
    --brand: #1f4d3a;
    --interact: #b8481f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--counter);
    font-family: 'Work Sans', system-ui, sans-serif;
    color: var(--ink);
    cursor: none;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }
  h1, h2, h3 { margin: 0; font-family: 'Fredoka', system-ui, sans-serif; }

  .device {
    position: relative;
    width: 100%; max-width: 1180px; height: calc(100vh - 60px);
    border-radius: 12px;
    box-shadow: 0 34px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    overflow: hidden;
    background: var(--ink);
  }
  @media (max-width: 1220px) {
    body { padding: 0; }
    .device { border-radius: 0; box-shadow: none; height: 100vh; }
  }

  .device img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 58%, rgba(9,10,7,.78) 0%, rgba(9,10,7,.5) 55%, rgba(9,10,7,.42) 100%);
  }

  .content {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 0 40px;
  }

  .content h1 {
    color: #fff; font-size: 108px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 0.98; margin-bottom: 20px;
  }
  .content p.sub {
    color: rgba(255,255,255,.86); font-size: 19px; font-weight: 500;
    margin-bottom: 40px; max-width: 40ch; line-height: 1.55;
  }
  @media (max-width: 900px) {
    .content h1 { font-size: 72px; }
  }

  #tt-cursor {
    position: fixed; top: 0; left: 0; width: 58px; height: 58px;
    margin-left: -29px; margin-top: -29px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4), rgba(255,255,255,0.1) 60%, transparent 78%);
    pointer-events: none; z-index: 9999;
    transition: width .18s ease, height .18s ease, background .18s ease, opacity .2s ease;
    will-change: transform;
  }
  #tt-cursor.tt-cursor-armed {
    width: 34px; height: 34px; margin-left: -17px; margin-top: -17px;
    background: radial-gradient(circle at 50% 50%, rgba(184,72,31,0.62), rgba(184,72,31,0.22) 60%, transparent 78%);
  }

  .touch-target {
    position: relative;
    cursor: none;
    overflow: hidden;
    transform: translateY(0) scale(1);
    transition: transform .17s cubic-bezier(.2,.8,.3,1), box-shadow .17s ease;
  }
  .touch-target.armed {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 18px 34px rgba(0,0,0,.4), 0 0 0 4px rgba(184,72,31,.55);
    z-index: 5;
  }
  .touch-target::after {
    content: '';
    position: absolute; left: 0; bottom: 0; height: 5px;
    width: calc(var(--tt-progress, 0) * 100%);
    background: var(--interact);
    z-index: 3;
  }
  .touch-target.tt-flash { animation: tt-flash .22s ease; }
  @keyframes tt-flash {
    0% { transform: translateY(-3px) scale(1.06); }
    100% { transform: translateY(-3px) scale(1.03); }
  }

  .begin-btn {
    background: var(--brand); color: #fff;
    border-radius: 999px; padding: 24px 56px;
    font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: .01em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.18), 0 14px 30px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
  <div class="device" id="device">
    <div class="scrim"></div>

    <div class="content">
      <h1>Let's order.</h1>
      <p class="sub">Hover, hold, done. Nobody has to touch this screen — including you.</p>
      <div class="touch-target begin-btn" id="begin-btn" data-armed-label="Hold" data-href="restaurants.html">Hold to begin</div>
    </div>
  </div>

<script>
  const device = document.getElementById('device');
  const img = document.createElement('img');
  img.className = 'bg';
  img.src = 'images/bayou-hero.jpg';
  img.alt = '';
  device.prepend(img);
</script>
<script src="engine.js"></script>
</body>
</html>
